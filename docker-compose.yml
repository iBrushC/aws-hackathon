services:
  neo4j:
    image: neo4j:5.26.0
    # The graph is meant to outlive any one working session — come back up on
    # its own after a Docker Desktop or machine restart. The data itself lives
    # in the neo4j_data volume below and survives container removal either way.
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:
